[unix_http_server]
file=/workspace/rvsf-supervisor.sock
chmod=0700

[supervisord]
logfile=/workspace/rvsf-supervisord.log
pidfile=/workspace/rvsf-supervisord.pid
childlogdir=/workspace

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/rvsf-supervisor.sock

[program:rvsf-model]
command=/opt/venv/bin/python /workspace/radeon-voice-skill-foundry-current/scripts/radeon_model_server.py
directory=/workspace/radeon-voice-skill-foundry-current
environment=HF_HOME="/root/.cache/huggingface",MODEL_ID="Qwen/Qwen3-4B-Instruct-2507",MODEL_HOST="127.0.0.1",MODEL_PORT="8000",MODEL_DTYPE="float16"
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rvsf-model.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:rvsf-asr]
command=/opt/venv/bin/python /workspace/radeon-voice-skill-foundry-current/scripts/radeon_asr_server.py
directory=/workspace/radeon-voice-skill-foundry-current
environment=HF_HOME="/root/.cache/huggingface",ASR_MODEL_ID="Qwen/Qwen3-ASR-0.6B",ASR_HOST="127.0.0.1",ASR_PORT="8001"
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rvsf-asr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:rvsf-api]
command=/bin/bash /workspace/radeon-voice-skill-foundry-current/scripts/radeon_api_supervisor.sh
directory=/workspace/radeon-voice-skill-foundry-current
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rvsf-live-api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:rvsf-tunnel]
command=/bin/bash /workspace/radeon-voice-skill-foundry-current/scripts/radeon_tunnel_supervisor.sh
directory=/workspace/radeon-voice-skill-foundry-current
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rvsf-cloudflared.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:rvsf-origin-registrar]
command=/bin/bash /workspace/radeon-voice-skill-foundry-current/scripts/radeon_origin_registrar.sh watch
directory=/workspace/radeon-voice-skill-foundry-current
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rvsf-origin-registrar.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:rvsf-public-monitor]
command=/bin/bash /workspace/radeon-voice-skill-foundry-current/scripts/monitor_public_radeon.sh
directory=/workspace/radeon-voice-skill-foundry-current
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/rvsf-public-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
